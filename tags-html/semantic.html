<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semântica</title>
</head>
<body>
    <!-- HEADER: Define o topo da página ou de uma seção. 
         Geralmente contém logo, título principal e navegação. -->
    <header>
        Todo o Conteúdo de cabeçalho do site
        <h1>Semântica HTML</h1>
        
        <!-- NAV: Bloco de links de navegação. Ajuda leitores de tela 
             e o Google a entenderem como se movimentar no seu site. -->
        <nav>
            <a href="https://www.phsystech.com.br">Link 1</a>
            <a href="https://phsystech.com.br">Link 2</a>
        </nav>
    </header>

    <!-- MAIN: O "Coração" da página. Deve ser ÚNICO por documento. 
         Informa que este é o conteúdo central, ignorando menus e rodapés. -->
    <main>
        <!-- SECTION: Agrupamento temático de conteúdo. 
             Use quando o conteúdo dentro dela faz sentido se lido junto. -->
        <section>
            <h2>Título da Minha primeira sessão</h2>
            <p>texto de parágrafo</p>
            <a href="#">Link</a>
        </section>
        
        <!-- ARTICLE: Conteúdo autossuficiente (ex: post de blog, notícia).
             Poderia ser retirado do site e ainda faria sentido sozinho. -->
        <article>
            <!-- Conteúdo independente aqui -->
        </article>
    </main>

    <!-- FOOTER: O rodapé. Contém informações de copyright, 
         contato ou links secundários. -->
    <footer>
        <span>2026</span> Paulo Henrique
    </footer>

    <!-- DIV: O "Coringa". Não tem valor semântico. 
         Use APENAS para fins de layout/estilização via CSS (ex: criar um container). -->
    <div></div>
</body>
</html>
