<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
        <header>
            <img src="logo-culturama.png" alt="logo culturama">
            <h1>Pesquisa de Opinião</h1>
        </header>
        <section>
            <!-- FORM: O container que captura os dados. 
                action="": URL para onde os dados serão enviados.
                method="get": Os dados aparecem na URL. Ideal para buscas e filtros. -->
            <form action="sucesso.html" method="get">
                <fieldset>
                    <!-- LEGEND: Cria um título visual e semântico para o grupo de campos. -->
                    <legend>Dados Pessoais</legend>
                    
                    <!-- LABEL: Associa o texto ao campo. Clicar no texto foca o input. -->
                    <label for="userName">Nome</label>
                    <!-- REQUIRED: Atributo de validação que impede o envio do form vazio. -->
                    <input id="userName" type="text" name="name" required>
                    <br>

                    <label for="userAge">Idade</label>
                    <!-- MIN/MAX: Restringe o valor numérico aceito pelo navegador. -->
                    <input id="userAge" type="number" name="userAge" min="12" max="100" required>
                    <br>

                    <label for="birthDate">Data de Nascimento</label>
                    <!-- TYPE="DATE": Invoca o seletor de calendário nativo. -->
                    <input id="birthDate" type="date" name="birthDate">            
                    <br>

                    <label for="userEmail">Email</label>
                    <input id="userEmail" type="email" name="userEmail">
                    <br>

                    <label for="userPhoneNumber">Telefone</label>
                    <!-- PATTERN: Usa Regex para validar o formato (ex: 11 números seguidos). -->
                    <input id="userPhoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + Número">
                    <br>

                    <!-- TYPE="FILE": Permite selecionar arquivos do dispositivo. -->
                    <input id="userImage" type="file" accept="image/*" name="userImage">
                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>
                    <p>Gênero:</p>
                    <!-- RADIO: Seleção única. O 'name' idêntico entre eles cria a exclusividade. -->
                    <input type="radio" name="userGender" value="Feminino">
                    <label for="userGender">Feminino</label>

                    <input type="radio" name="userGender" value="Masculino">
                    <label for="userGender">Masculino</label>
                    
                    <input type="radio" name="userGender" value="notinformed">
                    <label for="userGender">Prefiro não Informar</label>
                    <br>
                    <!-- SELECT: Menu de lista suspensa. -->
                    <p>Estado Civil:</p>
                    <select name="maritalStatus">
                        <option value="notinformed">Selecione...</option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="viuvo">Viúvo</option>
                    </select>
                    <br>

                    <label for="userState">Estado:</label>
                    <select name="userState" required>
                        <!--'value' é o que o servidor recebe; o texto entre as tags é o que o usuário vê. -->
                        <option value="acre">Acre</option>
                        <option value="alagoas">Alagoas</option>
                        <option value="amapa">Amapá</option>
                        <option value="amazonas">Amazonas</option>
                        <option value="bahia">Bahia</option>
                        <option value="ceara">Ceará</option>
                        <option value="distritoFederal">Distrito Federal</option>
                        <option value="espiritoSanto">Espirito Santo</option>
                        <option value="goias">Goiás</option>
                        <option value="maranhao">Maranhão</option>
                        <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                        <option value="matoGrosso">Mato Grosso</option>
                        <option value="minasGerais">Minas Gerais</option>
                        <option value="para">Pará</option>
                        <option value="paraiba">Paraíba</option>
                        <option value="parana">Paraná</option>
                        <option value=" pernambuco">Pernambuco</option>
                        <option value="piaui">Piauí</option>
                        <option value="rioDeJaneiro">Rio de Janeiro</option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                        <option value="rondonia">Rondônia</option>
                        <option value="roraima">Roraima</option>
                        <option value="santaCatarina">Santa Catarina</option>
                        <option value="saoPaulo">São Paulo</option>
                        <option value="sergipe">Sergipe</option>
                        <option value="tocantins">Tocantins</option>
                    </select>
                    <br>

                    <label for="userCity">Cidade:</label>
                    <!-- AUTOCOMPLETE: Ajuda o preenchimento automático do navegador (UX). -->
                    <input type="text" id="userCity" name="userCity" autocomplete="address-level2" placeholder="Ex.: Fortaleza" />
                </fieldset>

                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes Sociais:</p>
                    <!-- CHECKBOX: Seleção múltipla. Diferente do radio, permite marcar vários. -->
                    <input id="instagram" type="checkbox" name="social" value="instagram">
                    <label for="instagram">Instagram</label>
                    <br>
                    <input id="facebook" type="checkbox" name="social" value="facebook">
                    <label for="facebook">Facebook</label>
                    <br>
                    <input id="linkedin" type="checkbox" name="social" value="linkedin">
                    <label for="linkedin">LinkedIn</label>
                    <br>
                    <input id="x" type="checkbox" name="social" value="x">
                    <label for="x">X</label>
                    <br>
                    <label for="musicStyle">Estilo musical:</label>
                    <input list="styleTypes" name="userMusicStyle" type="text">
                    <datalist id="styleTypes">
                        <option value="rock">
                        <option value="pop">
                        <option value="samba">
                        <option value="Sertanejo">
                    </datalist>
                    <br>
                    <label for="favoriteColor">Cor Favorita</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">
                </fieldset>

                <fieldset>
                    <legend>Opinião</legend>
                    <p>Qual a qualidade de nosso serviço?</p>
                    <input type="radio" name="userOpinion" value="ótima">
                    <label for="userOpinion">Ótima</label>

                    <input type="radio" name="userOpinion" value="boa">
                    <label for="userOpinion">Boa</label>

                    <input type="radio" name="userOpinion" value="regular">
                    <label for="userOpinion">Regular</label>

                    <input type="radio" name="userOpinion" value="Ruim">
                    <label for="userOpinion">Ruim</label>
                    <br>
                    <label for="comment">Escreva sua opinião:</label>
                    <textarea id="comment" name="userComment" placeholder="Digite aqui sua opinião..."></textarea>
                </fieldset>

                <fieldset>
                    <legend>Confirmações</legend>

                    <input type="checkbox" name="userLGPD" id="userLgpdTerm" value="accepted" required>
                    <label for="userLgpdTerm">Eu aceito participar da Pesquisa</label><br>

                    <input type="checkbox" name="userGetResult" id="getResult" value="accepted" required>
                    <label for="userLgpdTerm">Desejo receber o resultado por email</label><br>

                </fieldset>
                <!-- BUTTON TYPE="SUBMIT": Envia os dados para o destino definido no form. -->
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </form>
        </section>
    </main>
</body>
</html>
